<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora - Portfólio</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container">
        
        <!-- Cabeçalho idêntico às outras telas -->
        <header class="app-header">
            <h2>Meu Portfólio</h2>
            <p>Poste fotos e vídeos dos seus trabalhos com valor e tempo de realização.</p>
        </header>

        <!-- Formulário de Nova Publicação -->
        <section class="card-section">
            <h3>Nova Publicação</h3>
            <form id="form-publicacao" style="margin-top: 15px; display: flex; flex-direction: column; gap: 15px;">
                
                <!-- Upload de Arquivo Estilizado -->
                <div class="form-group">
                    <label>Foto ou Vídeo do Trabalho *</label>
                    <div id="upload-box" onclick="document.getElementById('post-media').click()" 
                         style="border: 2px dashed var(--border-color, #e2e8f0); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; background: #fff; transition: all 0.2s;">
                        <span style="font-size: 24px; display: block; margin-bottom: 4px;">📸</span>
                        <strong style="font-size: 13px; color: #0f172a; display: block;">Clique para selecionar foto ou vídeo</strong>
                        <small style="font-size: 11px; color: #64748b;">JPG, PNG ou MP4</small>
                        <div id="file-name" style="margin-top: 8px; font-size: 12px; color: #10b981; font-weight: 600;"></div>
                    </div>
                    <input type="file" id="post-media" accept="image/*,video/*" required style="display: none;">
                </div>

                <!-- Título -->
                <div class="form-group">
                    <label for="post-titulo">Título / Nome do Trabalho *</label>
                    <input type="text" id="post-titulo" placeholder="Ex: Degradê Navalhado + Barba" required>
                </div>

                <!-- Serviço do Catálogo -->
                <div class="form-group">
                    <label for="post-servico">Vincular a um Serviço (Opcional)</label>
                    <select id="post-servico">
                        <option value="">Nenhum (Apenas exibição)</option>
                    </select>
                </div>

                <!-- Preço e Tempo -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label for="post-preco">Valor (R$) *</label>
                        <input type="number" id="post-preco" step="0.01" placeholder="35.00" required>
                    </div>
                    <div class="form-group">
                        <label for="post-tempo">Tempo (min) *</label>
                        <input type="number" id="post-tempo" placeholder="45" required>
                    </div>
                </div>

                <!-- Descrição -->
                <div class="form-group">
                    <label for="post-descricao">Descrição / Detalhes</label>
                    <textarea id="post-descricao" rows="3" placeholder="Detalhes dos produtos usados, técnicas..."></textarea>
                </div>

                <div id="pub-error-msg" style="color: #ef4444; font-size: 13px; display: none;"></div>

                <button type="submit" id="btn-submit-post" class="btn-primary">Publicar no Portfólio</button>
            </form>
        </section>

        <!-- Feed de Publicações Cadastradas -->
        <section class="card-section" style="margin-top: 20px;">
            <h3>Publicações Ativas</h3>
            <div id="posts-list" style="margin-top: 15px; display: flex; flex-direction: column; gap: 15px;">
                <p style="color: #64748b; font-size: 13px;">Carregando publicações...</p>
            </div>
        </section>

    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/publicacoes.js"></script>
    <script>
        document.getElementById('post-media').addEventListener('change', function() {
            const fileNameDiv = document.getElementById('file-name');
            if (this.files && this.files[0]) {
                fileNameDiv.textContent = '✓ ' + this.files[0].name;
            } else {
                fileNameDiv.textContent = '';
            }
        });
    </script>
</body>
</html>
